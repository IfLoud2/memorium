<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mémorium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#E2E7F1; --ink:#131A2A; --ink-2:#56607A; --line:#D2D9E8;
  --accent:#2D47F5; --accent-ink:#FFFFFF;
  --new:#2D47F5; --learn:#D63A3A; --review:#1D8548;
  --again:#D63A3A; --hard:#96590A; --good:#1D8548; --easy:#2D47F5;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E121B; --surface:#161C29; --surface-2:#212A3B; --ink:#E7EBF5; --ink-2:#97A3BF; --line:#283146;
    --accent:#8196FF; --accent-ink:#0E121B;
    --new:#8FA1FF; --learn:#FF7E7E; --review:#4FD08A;
    --again:#FF7E7E; --hard:#EBB04D; --good:#4FD08A; --easy:#8FA1FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E121B; --surface:#161C29; --surface-2:#212A3B; --ink:#E7EBF5; --ink-2:#97A3BF; --line:#283146;
  --accent:#8196FF; --accent-ink:#0E121B;
  --new:#8FA1FF; --learn:#FF7E7E; --review:#4FD08A;
  --again:#FF7E7E; --hard:#EBB04D; --good:#4FD08A; --easy:#8FA1FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 28px;-webkit-tap-highlight-color:transparent;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.top .acts{display:flex;gap:8px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.top h1{font-size:1.9rem;font-weight:700}
.top .sub{margin:2px 0 0;font-size:.875rem;color:var(--ink-2)}
.ibtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:var(--surface);border:1px solid var(--line);flex:none}
.ibtn svg{width:22px;height:22px}
.ibtn.plain{background:none;border-color:transparent}

.decks{display:flex;flex-direction:column;gap:10px}
.deck{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 14px 14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.deck .name{font-family:var(--font-display);font-weight:600;font-size:1.08rem;min-width:0;overflow-wrap:anywhere}
.deck .meta{font-size:.8rem;color:var(--ink-2);margin-top:2px}
.deck .grow{flex:1;min-width:0}
.cnt{display:flex;gap:10px;font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.c-n{color:var(--new)}.c-l{color:var(--learn)}.c-r{color:var(--review)}
.cnt .z{opacity:.28}
.chev{width:18px;height:18px;color:var(--ink-2);flex:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.empty{text-align:center;padding:36px 20px}
.empty h2{font-size:1.3rem;margin-bottom:8px}
.empty p{margin:0 0 18px;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 45%,var(--line))}
.btn.danger.armed{background:var(--learn);color:var(--bg);border-color:var(--learn)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.field textarea{min-height:96px;resize:vertical}
.note{font-size:.82rem;color:var(--ink-2);margin:14px 2px 0}
.banner{margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:.85rem;background:color-mix(in srgb,var(--hard) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--hard) 45%,var(--line))}
.banner.err{background:color-mix(in srgb,var(--learn) 14%,var(--surface));border-color:color-mix(in srgb,var(--learn) 45%,var(--line))}
.flash{color:var(--review);font-size:.85rem;font-weight:600;min-height:1.3em;margin:6px 0 0}

.dhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dhead h1{font-size:1.5rem;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.bigcnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bigcnt div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bigcnt b{display:block;font-family:var(--font-mono);font-size:1.6rem;line-height:1.1}
.bigcnt span{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin:16px 0 12px}
.seg button{min-height:44px;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);outline:1px solid var(--line)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-family:var(--font-mono);font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);flex:none}
.pill.n{color:var(--new)}.pill.l{color:var(--learn)}
.del{width:44px;height:44px;border-radius:10px;color:var(--ink-2);display:grid;place-items:center;flex:none}
.del.armed{background:var(--learn);color:var(--bg)}
.del svg{width:19px;height:19px}

.study{display:flex;flex-direction:column;min-height:calc(100dvh - 56px);padding-bottom:128px}
.sbar{display:flex;align-items:center;gap:8px;padding-bottom:10px}
.sbar .ttl{flex:1;min-width:0;text-align:center;font-size:.85rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar .cnt{justify-content:flex-end;min-width:96px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin:4px 0 0;min-height:52vh;box-shadow:0 10px 30px -18px rgba(20,30,70,.35)}
.face{font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,5.6vw,1.8rem);line-height:1.25;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:balance}
.face.small{font-size:1rem;font-weight:500;color:var(--ink-2)}
.ans{margin-top:22px;padding-top:22px;border-top:1px dashed var(--line);animation:rise .22s ease-out}
.face.back{font-weight:500;font-size:clamp(1.15rem,4.8vw,1.5rem)}
.tag{display:block;text-align:center;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ans{animation:none}}

.abar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));z-index:5}
.abar-in{max-width:560px;margin:0 auto}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g{--c:var(--accent);min-height:64px;border-radius:12px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface));color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;min-width:0}
.g b{font-size:.92rem}
.g small{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-2);white-space:nowrap}
.g1{--c:var(--again)}.g2{--c:var(--hard)}.g3{--c:var(--good)}.g4{--c:var(--easy)}
.reveal{min-height:56px;font-size:1.05rem}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:30px 10px}
.done h2{font-size:1.6rem}
.done p{margin:0;color:var(--ink-2)}
.done .big{font-family:var(--font-mono);font-size:2.6rem;font-weight:700;color:var(--review)}
@media (max-width:360px){.g b{font-size:.8rem}.cnt{gap:7px}}
</style>

<div id="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
(function(){
'use strict';
var MIN=60000, DAY=86400000, NEW_CAP=20, LEARN_AHEAD=20*MIN;
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var S={decks:{},view:'home',deckId:null,tab:'cards',sess:null,sync:'init',creating:false,arm:null,flash:'',user:null,account:'in',authErr:'',authInfo:'',busy:false,recovery:false};
var CFG=window.MEMORIUM||{};
var sb=null,flushing=false,again=false,timer=null;
var pend={d:{},c:{},xc:{},xd:{}};

var I={
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
 close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};

function endToday(){var d=new Date();d.setHours(23,59,59,999);return d.getTime()}
function dayKey(t){var d=new Date(t||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function newCard(f,b){return{id:uid('c'),f:f,b:b,st:0,due:0,ivl:0,ease:2.5,step:0,reps:0,lapses:0}}
function sched(c,g,now){
  now=now||Date.now();
  var x=Object.assign({},c), steps=[1,10];
  x.reps=(c.reps||0)+1;
  if(c.st===2){
    if(g===1){x.lapses=(c.lapses||0)+1;x.ease=Math.max(1.3,c.ease-.2);x.ivl=Math.max(1,Math.round(c.ivl*.4));x.st=1;x.step=1;x.due=now+10*MIN}
    else{
      var iv;
      if(g===2){iv=Math.max(c.ivl+1,Math.round(c.ivl*1.2));x.ease=Math.max(1.3,c.ease-.15)}
      else if(g===3){iv=Math.max(c.ivl+1,Math.round(c.ivl*c.ease))}
      else{iv=Math.max(c.ivl+1,Math.round(c.ivl*c.ease*1.3));x.ease=c.ease+.15}
      x.ivl=iv;x.due=now+iv*DAY;
    }
  }else{
    var s=c.step||0;
    if(g===1){x.st=1;x.step=0;x.due=now+steps[0]*MIN}
    else if(g===2){x.st=1;x.due=now+(s>0?10:6)*MIN}
    else if(g===3){
      if(s+1<steps.length){x.st=1;x.step=s+1;x.due=now+steps[x.step]*MIN}
      else{x.st=2;x.ivl=c.ivl>0?c.ivl:1;x.step=0;x.due=now+x.ivl*DAY}
    }else{x.st=2;x.ivl=Math.max(c.ivl||0,4);x.step=0;x.due=now+x.ivl*DAY}
  }
  return x;
}
function fmtIvl(x,now){
  if(x.st===1){var m=Math.round((x.due-now)/MIN);return m<1?'<1 min':m+' min'}
  var d=x.ivl;
  if(d<30)return d+' j';
  if(d<365){var mo=d/30;return (mo<10?mo.toFixed(1).replace('.',','):Math.round(mo))+' mois'}
  return (d/365).toFixed(1).replace('.',',')+' an'+(d>=730?'s':'');
}
function counts(d){
  var now=Date.now(),eod=endToday(),n=0,l=0,r=0;
  d.cards.forEach(function(c){
    if(c.st===0)n++;
    else if(c.st===1){if(c.due<=now+LEARN_AHEAD)l++}
    else if(c.due<=eod)r++;
  });
  return{n:Math.min(n,NEW_CAP),l:l,r:r};
}
function todayDone(){
  var k=dayKey(),t=0;
  Object.keys(S.decks).forEach(function(id){t+=((S.decks[id].log||{})[k])||0});
  return t;
}

function lsLoad(){try{return JSON.parse(localStorage.getItem('memorium.v1')||'{}')}catch(e){return{}}}
function lsSave(){try{localStorage.setItem('memorium.v1',JSON.stringify(S.decks))}catch(e){}}
function anyPending(){return flushing||Object.keys(pend.d).length>0||Object.keys(pend.c).length>0||Object.keys(pend.xc).length>0||Object.keys(pend.xd).length>0}
function later(){clearTimeout(timer);timer=setTimeout(flush,S.user?600:250)}
function markDeck(id){pend.d[id]=1;later()}
function markCard(did,cid){pend.c[cid]=did;later()}
function markDelCard(cid){delete pend.c[cid];pend.xc[cid]=1;later()}
function markDelDeck(did){
  delete pend.d[did];
  Object.keys(pend.c).forEach(function(c){if(pend.c[c]===did)delete pend.c[c]});
  pend.xd[did]=1;later();
}
function saveDeck(id){
  markDeck(id);
  (S.decks[id].cards||[]).forEach(function(c){markCard(id,c.id)});
}
function ck(r){if(r&&r.error)throw r.error;return r}
function chunk(a,n){var o=[];for(var i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o}
async function flush(){
  if(flushing){again=true;return}
  flushing=true;
  var p=pend;pend={d:{},c:{},xc:{},xd:{}};
  try{
    if(sb&&S.user){
      var u=S.user.id,xd=Object.keys(p.xd),xc=Object.keys(p.xc);
      if(xd.length)ck(await sb.from('decks').delete().in('id',xd));
      var dr=Object.keys(p.d).filter(function(id){return S.decks[id]}).map(function(id){
        var d=S.decks[id];return{id:id,user_id:u,name:d.name,log:d.log||{},created:d.created||0};
      });
      if(dr.length)ck(await sb.from('decks').upsert(dr));
      var byDeck={},rows=[];
      Object.keys(p.c).forEach(function(cid){(byDeck[p.c[cid]]=byDeck[p.c[cid]]||[]).push(cid)});
      Object.keys(byDeck).forEach(function(did){
        var dk=S.decks[did];if(!dk)return;
        var m={};dk.cards.forEach(function(c){m[c.id]=c});
        byDeck[did].forEach(function(cid){if(m[cid])rows.push({id:cid,deck_id:did,user_id:u,data:m[cid]})});
      });
      var parts=chunk(rows,500),i;
      for(i=0;i<parts.length;i++)ck(await sb.from('cards').upsert(parts[i]));
      parts=chunk(xc,200);
      for(i=0;i<parts.length;i++)ck(await sb.from('cards').delete().in('id',parts[i]));
    }else lsSave();
    if(S.sync==='error'||S.sync==='syncing'){S.sync='ok';render()}
  }catch(e){
    ['d','c','xc','xd'].forEach(function(k){Object.keys(p[k]).forEach(function(i){if(!(i in pend[k]))pend[k][i]=p[k][i]})});
    S.sync='error';render();
  }finally{flushing=false;if(again){again=false;later()}}
}
async function pull(){
  if(!sb||!S.user||anyPending())return;
  try{
    var decks=[],cards=[],from=0,n=1000,r;
    do{r=ck(await sb.from('decks').select('id,name,log,created').order('id').range(from,from+n-1));decks=decks.concat(r.data);from+=n}while(r.data.length===n);
    from=0;
    do{r=ck(await sb.from('cards').select('id,deck_id,data').order('id').range(from,from+n-1));cards=cards.concat(r.data);from+=n}while(r.data.length===n);
    if(anyPending())return;
    var next={};
    decks.forEach(function(d){next[d.id]={name:d.name,log:d.log||{},created:d.created||0,cards:[]}});
    cards.forEach(function(c){if(next[c.deck_id])next[c.deck_id].cards.push(c.data)});
    S.decks=next;S.sync='ok';
    if(S.deckId&&!S.decks[S.deckId]&&S.view!=='home'&&S.view!=='account'){S.view='home';S.sess=null}
    render();
  }catch(e){S.sync='error';render()}
}
function syncNow(){S.sync='syncing';render();clearTimeout(timer);flush().then(pull)}
async function afterSignIn(){
  S.sync='syncing';render();
  await pull();
  var loc=lsLoad(),ids=Object.keys(loc).filter(function(id){return !S.decks[id]&&loc[id]&&Array.isArray(loc[id].cards)});
  if(ids.length&&S.sync!=='error'){
    ids.forEach(function(id){S.decks[id]=loc[id];saveDeck(id)});
    clearTimeout(timer);await flush();
    if(S.sync!=='error'){
      try{localStorage.removeItem('memorium.v1')}catch(e){}
      flash(ids.length+' paquet'+(ids.length>1?'s':'')+' de cet appareil ajouté'+(ids.length>1?'s':'')+' à ton compte');
    }
  }
  render();
}
function authMsg(e){
  var m=String(e&&e.message||'');
  if(/invalid login/i.test(m))return 'E-mail ou mot de passe incorrect.';
  if(/already (been )?registered/i.test(m))return 'Un compte existe déjà avec cet e-mail.';
  if(/not confirmed/i.test(m))return 'E-mail pas encore confirmé. Ouvre le lien reçu par e-mail.';
  if(/rate limit|too many|seconds/i.test(m))return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(/password/i.test(m))return 'Mot de passe refusé : 8 caractères minimum.';
  if(/valid email|invalid.*email/i.test(m))return 'Adresse e-mail invalide.';
  return 'Action impossible. Vérifie ta connexion internet.';
}
async function doAuth(){
  var em=val('em').trim(),pw=val('pw');
  S.authInfo='';
  if(!em||!pw){S.authErr='Renseigne l’e-mail et le mot de passe.';render();return}
  if(S.account==='up'&&pw.length<8){S.authErr='Mot de passe : 8 caractères minimum.';render();return}
  S.busy=true;S.authErr='';render();
  try{
    if(S.account==='up'){
      var r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href.split('#')[0]}});
      if(r.error)throw r.error;
      if(!r.data.session){S.authInfo='Compte créé. Ouvre le lien reçu par e-mail pour le confirmer, puis connecte-toi.';S.account='in'}
    }else{

function grade(g){
  var s=S.sess,c=cur();if(!c||!s.shown)return;
  var d=S.decks[s.deckId],k=dayKey(),now=Date.now();
  var prev=Object.assign({},c),x=sched(c,g,now);
  Object.assign(c,x);
  d.log=d.log||{};d.log[k]=(d.log[k]||0)+1;
  s.hist.push({prev:prev,k:k});
  s.queue.shift();
  if(c.st===1){s.queue.splice(Math.min(s.queue.length,3),0,c.id)}
  s.shown=false;s.done++;
  markCard(s.deckId,c.id);markDeck(s.deckId);render();window.scrollTo(0,0);
}
function undo(){
  var s=S.sess;if(!s||!s.hist.length)return;
  var h=s.hist.pop(),d=S.decks[s.deckId];
  var c=d.cards.find(function(z){return z.id===h.prev.id});
  if(c){
    Object.assign(c,h.prev);
    s.queue=s.queue.filter(function(i){return i!==c.id});
    s.queue.unshift(c.id);
    d.log[h.k]=Math.max(0,(d.log[h.k]||1)-1);
  }
  s.shown=false;s.done=Math.max(0,s.done-1);
  if(c)markCard(s.deckId,c.id);
  markDeck(s.deckId);render();
}
var SEPS={tab:'\t',semicolon:';',comma:',',pipe:'|',colon:':',space:' '};
function decodeHtml(s){var t=document.createElement('textarea');t.innerHTML=s;return t.value}
function cleanField(s,html){
  s=String(s).replace(/\[sound:[^\]]*\]/g,'');
  if(html||/<\/?[a-z][^>]*>/i.test(s)){
    s=s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li|tr|h[1-6])>/gi,'\n').replace(/<li[^>]*>/gi,'- ').replace(/<[^>]*>/g,'');
    s=decodeHtml(s);
  }
  return s.replace(/ /g,' ').replace(/\\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function splitRows(txt,sep){
  var rows=[],row=[],f='',q=false,i=0,n=txt.length,ch;
  while(i<n){
    ch=txt[i];
    if(q){
      if(ch==='"'){if(txt[i+1]==='"'){f+='"';i+=2;continue}q=false;i++;continue}
      f+=ch;i++;continue;
    }
    if(ch==='"'&&f===''){q=true;i++;continue}
    if(ch===sep){row.push(f);f='';i++;continue}
    if(ch==='\r'){i++;continue}
    if(ch==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue}
    f+=ch;i++;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function parseImport(txt){
  txt=String(txt).replace(/^﻿/,'');
  var meta={html:false},lines=txt.split(/\r?\n/),k=0;
  while(k<lines.length&&/^#/.test(lines[k])){
    var m=lines[k].match(/^#\s*([a-z ]+?)\s*:\s*(.*)$/i);
    if(m){
      var key=m[1].toLowerCase(),v=m[2].trim();
      if(key==='separator')meta.sep=SEPS[v.toLowerCase()]||(v.length===1?v:null);
      else if(key==='html')meta.html=v.toLowerCase()==='true';
      else if(/ column$/.test(key))meta[key.replace(' column','')]=parseInt(v,10)-1;
    }
    k++;
  }
  var body=lines.slice(k).join('\n'),sep=meta.sep;
  if(!sep){
    var first=body.split('\n').find(function(l){return l.trim()})||'';
    sep=first.indexOf('\t')>=0?'\t':first.indexOf(';')>=0?';':first.indexOf('|')>=0?'|':first.indexOf(',')>=0?',':';';
  }
  var skip={};
  ['guid','notetype','deck','tags'].forEach(function(n){if(meta[n]>=0)skip[meta[n]]=1});
  var out=[],clozeRe=/\{\{c(\d+)::([\s\S]*?)(?:::([^}]*))?\}\}/g;
  splitRows(body,sep).forEach(function(r){
    if(r.every(function(x){return !x.trim()}))return;
    var fields=r.filter(function(_,i){return !skip[i]});
    var f=cleanField(fields[0]||'',meta.html),b=cleanField(fields[1]||'',meta.html);
    if(/\{\{c\d+::/.test(f)){
      var nums=[];
      f.replace(/\{\{c(\d+)::/g,function(_,n){if(nums.indexOf(n)<0)nums.push(n);return ''});
      var shown=f.replace(clozeRe,function(_,i,t){return t});
      nums.forEach(function(n){
        var front=f.replace(clozeRe,function(_,i,t,h){return i===n?'['+(h||'…')+']':t});
        out.push(newCard(front,b?shown+'\n\n'+b:shown));
      });
      return;
    }
    if(f&&b)out.push(newCard(f,b));
  });
  return out;
}

  return '#separator:tab\n#html:true\n'+d.cards.map(function(c){return e(c.f)+'\t'+e(c.b)}).join('\n');
}

function act(a,ds){
  var d=S.decks[S.deckId];
  switch(a){
    case 'home':S.view='home';S.sess=null;S.arm=null;render();break;
    case 'open':S.deckId=ds.id;S.view='deck';S.tab='cards';S.arm=null;render();window.scrollTo(0,0);break;
    case 'tab':S.tab=ds.tab;S.arm=null;render();break;
    case 'study':startStudy(S.deckId);break;
    case 'show':if(S.sess){S.sess.shown=true;render()}break;
    case 'grade':grade(+ds.g);break;
    case 'undo':undo();break;
    case 'newdeck':S.creating=true;render();var e=$('#deckname');if(e)e.focus();break;
    case 'cancelnew':S.creating=false;render();break;
    case 'mkdeck':
      var nm=val('deckname').trim();if(!nm)break;
      S.creating=false;var id=addDeck(nm);S.deckId=id;S.view='deck';S.tab='add';render();break;
    case 'sample':
      var sid=addDeck('Exemple · Électronique embarquée',sampleCards());S.deckId=sid;S.view='deck';S.tab='cards';render();break;
    case 'addcard':
      var f=val('cf').trim(),b=val('cb').trim();
      if(!f||!b){S.flash='';flash('Remplis les deux faces.');var fl=$('#flash');if(fl){fl.textContent='Remplis les deux faces.'}break}
      var nc=newCard(f,b);d.cards.push(nc);markCard(S.deckId,nc.id);
      render();$('#cf').value='';$('#cb').value='';$('#cf').focus();
      S.flash='';flash('Carte ajoutée · '+d.cards.length+' au total');$('#flash').textContent=S.flash;break;
    case 'account':S.view='account';S.authErr='';S.authInfo='';render();break;
    case 'authmode':S.account=ds.mode;S.authErr='';S.authInfo='';render();break;
    case 'reset':doReset();break;
    case 'signout':if(sb)sb.auth.signOut();break;
    case 'syncnow':syncNow();break;
    case 'pickfile':var pf=$('#ifile');if(pf)pf.click();break;
    case 'import':
      var cs=parseImport(val('io'));
      if(!cs.length){flash('Aucune carte reconnue.');$('#flash').textContent=S.flash;break}
      var seen={};d.cards.forEach(function(c){seen[c.f+'\u0000'+c.b]=1});
      var fresh=cs.filter(function(c){var k=c.f+'\u0000'+c.b;if(seen[k])return false;seen[k]=1;return true});
      if(fresh.length){d.cards=d.cards.concat(fresh);fresh.forEach(function(c){markCard(S.deckId,c.id)})}
      render();$('#io').value='';
      var dup=cs.length-fresh.length;
      flash(fresh.length+' carte'+(fresh.length>1?'s':'')+' importée'+(fresh.length>1?'s':'')+(dup?' · '+dup+' déjà présente'+(dup>1?'s':''):''));
      $('#flash').textContent=S.flash;break;
    case 'export':
      var txt=exportText(d),ta=$('#io');ta.value=txt;
      var done=function(){flash('Export copié');$('#flash').textContent=S.flash};
      var fail=function(){ta.focus();ta.select();flash('Texte sélectionné : copie-le à la main.');$('#flash').textContent=S.flash};
      try{navigator.clipboard.writeText(txt).then(done,fail)}catch(e){fail()}break;
    case 'delcard':
      if(S.arm!==ds.id){S.arm=ds.id;render();break}
      d.cards=d.cards.filter(function(c){return c.id!==ds.id});S.arm=null;markDelCard(ds.id);render();break;
    case 'deldeck':
      if(S.arm!=='deck'){S.arm='deck';render();break}
      var did=S.deckId;markDelDeck(did);delete S.decks[did];S.arm=null;S.view='home';render();break;
  }
}

  if(S.recovery){
    return h+err+'<form class="panel" data-form="setpw"><div class="field"><label for="pw">Nouveau mot de passe</label><input id="pw" data-keep type="password" autocomplete="new-password" minlength="8"></div>'+
      '<button class="btn primary block" type="submit"'+(S.busy?' disabled':'')+'>Enregistrer le mot de passe</button></form>';
  }
  if(S.user){
    var st=S.sync==='syncing'?'Synchronisation en cours…':S.sync==='error'?'Dernière synchronisation échouée.':'Synchronisé.';
    return h+syncBanner()+'<div class="panel"><div class="field"><label>Connecté</label><div class="mono" style="overflow-wrap:anywhere">'+esc(S.user.email||'')+'</div></div>'+
      '<p class="muted" style="margin:0 0 14px">'+st+'</p><div class="stack"><button class="btn block" data-act="syncnow">Synchroniser maintenant</button><button class="btn block" data-act="signout">Se déconnecter</button></div></div>'+
      '<p class="note">Tes paquets et ta progression (étape de chaque carte, prochaine révision, historique du jour) sont enregistrés dans ton compte et retrouvés sur tous tes appareils.</p>';
  }
  var up=S.account==='up';
  return h+info+err+'<div class="seg two" role="tablist"><button role="tab" aria-selected="'+(!up)+'" data-act="authmode" data-mode="in">Connexion</button><button role="tab" aria-selected="'+up+'" data-act="authmode" data-mode="up">Créer un compte</button></div>'+
    '<form class="panel" data-form="auth"><div class="field"><label for="em">E-mail</label><input id="em" data-keep type="email" autocomplete="email" inputmode="email"></div>'+
    '<div class="field"><label for="pw">Mot de passe'+(up?' (8 caractères minimum)':'')+'</label><input id="pw" data-keep type="password" autocomplete="'+(up?'new-password':'current-password')+'"></div>'+
    '<button class="btn primary block" type="submit"'+(S.busy?' disabled':'')+'>'+(up?'Créer mon compte':'Se connecter')+'</button>'+
    (up?'':'<button class="btn block" type="button" data-act="reset" style="margin-top:10px">Mot de passe oublié</button>')+'</form>'+
    '<p class="note">Les paquets présents sur cet appareil seront ajoutés à ton compte à la première connexion.</p>';
}
function viewStudy(){
  var s=S.sess,d=S.decks[s.deckId];if(!d)return viewHome();
  var c=cur();
  var q={n:0,l:0,r:0};
  s.queue.forEach(function(id){var k=d.cards.find(function(z){return z.id===id});if(!k)return;if(k.st===0)q.n++;else if(k.st===1)q.l++;else q.r++});
  var h='<div class="study"><div class="sbar"><button class="ibtn plain" data-act="home" aria-label="Quitter la session">'+I.close+'</button><div class="ttl">'+esc(d.name)+'</div>'+
        (s.hist.length?'<button class="ibtn plain" data-act="undo" aria-label="Annuler la dernière réponse">'+I.undo+'</button>':'')+cntHtml(q)+'</div>';
  if(!c){
    var nxt=d.cards.filter(function(k){return k.st===2}).map(function(k){return k.due}).sort(function(a,b){return a-b})[0];
    var when=nxt?(function(){var dd=Math.ceil((nxt-Date.now())/DAY);return dd<=1?'demain':'dans '+dd+' jours'})():'';
    h+='<div class="done"><div class="big">'+s.done+'</div><h2>Session terminée</h2><p>'+(s.done?'carte'+(s.done>1?'s':'')+' révisée'+(s.done>1?'s':'')+' dans cette session.':'Aucune carte à réviser maintenant.')+(when?' Prochaine révision '+when+'.':'')+'</p>'+
       '<button class="btn primary" data-act="home" style="margin-top:8px">Retour aux paquets</button></div></div>';
    return h;
  }
  h+='<div class="stage"><span class="tag">'+(c.st===0?'nouvelle':c.st===1?'apprentissage':'révision')+'</span>';
  h+='<div class="face'+(s.shown?' small':'')+'">'+esc(c.f)+'</div>';
  if(s.shown)h+='<div class="ans"><span class="tag">réponse</span><div class="face back">'+esc(c.b)+'</div></div>';
  h+='</div></div>';
  h+='<div class="abar"><div class="abar-in">';
  if(!s.shown){
    h+='<button class="btn primary block reveal" data-act="show">Afficher la réponse</button>';
  }else{
    var now=Date.now(),L=['À revoir','Difficile','Bien','Facile'];
    h+='<div class="grades">'+[1,2,3,4].map(function(g){return '<button class="g g'+g+'" data-act="grade" data-g="'+g+'"><b>'+L[g-1]+'</b><small>'+fmtIvl(sched(c,g,now),now)+'</small></button>'}).join('')+'</div>';
  }
  h+='</div></div>';
  return h;
}
function render(){
  var keep=Array.prototype.map.call(document.querySelectorAll('[data-keep]'),function(e){
    return{id:e.id,v:e.value,f:document.activeElement===e,s:e.selectionStart};
  });
  $('#app').innerHTML=S.view==='study'&&S.sess?viewStudy():S.view==='deck'?viewDeck():S.view==='account'?viewAccount():viewHome();
  keep.forEach(function(k){
    var e=document.getElementById(k.id);
    if(e){e.value=k.v;if(k.f){e.focus();try{e.setSelectionRange(k.s,k.s)}catch(_){}}}
  });
  var fl=$('#flash');if(fl)fl.textContent=S.flash;
}
init();
})();
</script>
